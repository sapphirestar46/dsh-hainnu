name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 语法检查
        run: for f in index.js client.js lib/*.js; do node --check "$f"; done
      - name: 离线测试
        run: |
          node test/guard-smoke.mjs
          node test/proxy-smoke.mjs
          node test/login-smoke.mjs
          node test/client-smoke.mjs
          node test/store-smoke.mjs
          node test/modelconfig-smoke.mjs
